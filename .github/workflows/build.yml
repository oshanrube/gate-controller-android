name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the bundle to the Play Store internal testing track
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Only master and manual runs are trusted with the upload key and the Play credentials.
      # Everything else, pull requests included, runs Gradle code that a branch can change,
      # so it builds unsigned (debug key) and never sees a secret.
      TRUSTED: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
      # Whether each secret is set, as a plain true/false: steps can't test secrets directly.
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs (unsigned release)
        if: env.TRUSTED != 'true' || env.HAS_UPLOAD_KEY != 'true'
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease lintDebug

      - name: Build APKs and Play bundle (signed with the upload key)
        if: env.TRUSTED == 'true' && env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$UPLOAD_KEYSTORE_PATH"
          unset UPLOAD_KEYSTORE_BASE64
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease lintDebug
          rm -f "$UPLOAD_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: gate-controller-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gate-controller-bundle
          path: app/build/outputs/bundle/release/*.aab

      # Pushes to master, or a manual run with "publish" ticked, go to the internal testing
      # track. Needs the app to exist in Play Console with one bundle uploaded by hand first
      # (the API cannot create an app), so it only runs once the PLAY_PUBLISH repository
      # variable is set to "true".
      - name: Upload to Play (internal testing)
        if: >-
          vars.PLAY_PUBLISH == 'true' &&
          env.TRUSTED == 'true' && env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true' &&
          (github.event_name == 'push' || inputs.publish)
        # Pinned to a commit: this step is handed the Play service account, so a moved tag
        # must not be able to swap the code that receives it.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.oshanrube.gatecontroller
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
