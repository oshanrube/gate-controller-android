name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the bundle to the Play Store internal testing track
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APKs and Play bundle
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gate-controller-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gate-controller-bundle
          path: app/build/outputs/bundle/release/*.aab

      # Pushes to master, or a manual run with "publish" ticked, go to the internal testing
      # track. Needs the app to exist in Play Console with one bundle uploaded by
      # hand first — the API cannot create an app — so it only runs once the PLAY_PUBLISH
      # repository variable is set to "true". Until then the build stays green and the
      # bundle is still attached as an artifact for that first manual upload.
      - name: Upload to Play (internal testing)
        if: >-
          vars.PLAY_PUBLISH == 'true' &&
          env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.UPLOAD_KEYSTORE_BASE64 != '' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.oshanrube.gatecontroller
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
